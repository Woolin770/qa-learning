<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>QA 学习看板</title>
<style>
  :root{
    --bg:#0f1419; --card:#171e26; --card2:#1c242e; --line:#2a3542;
    --text:#e6edf3; --dim:#8b98a5; --accent:#4a9eff; --ok:#3fb950; --gate:#f85149;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:13px/1.5 "微软雅黑",system-ui,sans-serif;padding:10px;min-width:380px}
  h1{font-size:15px;font-weight:600}
  .sub{color:var(--dim);font-size:11px;margin-top:2px}
  .hero{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
  .badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:600}
  .b-gate{background:#4a1d1d;color:#ff9b9b}
  .bar{height:6px;background:#0b0f14;border-radius:3px;overflow:hidden;margin-top:8px}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,#2f81f7,#3fb950);width:0;transition:width .2s}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .today{margin-top:8px;padding:8px;background:#12202b;border-left:3px solid var(--ok);border-radius:4px;font-size:12px}
  .today b{color:#7ee787}
  .btns{display:flex;gap:6px;margin-bottom:8px}
  button{background:#22303d;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:11px;cursor:pointer}
  button:hover{background:#2b3a49}
  .week{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
  .week.now{border-color:var(--accent)}
  .wh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;cursor:pointer;background:var(--card2)}
  .wh:hover{background:#22303d}
  .wt{font-weight:600;font-size:12.5px}
  .wd{color:var(--dim);font-size:11px}
  .wb{padding:6px 8px 8px;display:none}
  .week.open .wb{display:block}
  .dayblk{border:1px solid transparent;border-radius:6px;padding:5px 6px;margin-bottom:3px}
  .dayblk.today{border-color:#2ea043;background:#12202b}
  .dh{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:2px}
  .dh .dname{color:#9ecbff;font-weight:600}
  .dayblk.today .dh .dname{color:#7ee787}
  .item{display:flex;gap:6px;align-items:flex-start;padding:3px 2px;border-radius:4px;cursor:pointer}
  .item:hover{background:#1b242e}
  .item input{margin-top:2px;accent-color:#3fb950;flex:0 0 auto}
  .mm{flex:0 0 auto;color:#d29922;font-size:10.5px;font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
  .tx{font-size:12px;flex:1}
  .out{display:block;color:var(--dim);font-size:10.5px;margin-top:1px}
  .item.done .tx{color:var(--dim);text-decoration:line-through}
  .foot{color:var(--dim);font-size:10.5px;margin-top:8px;padding:8px;border-top:1px solid var(--line);line-height:1.7}
  .foot code{background:#0b0f14;padding:1px 4px;border-radius:3px;color:#9ecbff}
</style>
</head>
<body>
<div class="hero">
  <div class="row">
    <div>
      <h1 id="title">QA 学习看板</h1>
      <div class="sub" id="sub">加载中…</div>
    </div>
    <div style="text-align:right">
      <div class="sub">完成 <b id="done" style="color:#e6edf3">0</b>/<b id="total" style="color:#e6edf3">0</b></div>
      <div class="sub" id="pct" style="color:#3fb950"></div>
    </div>
  </div>
  <div class="bar"><i id="prog"></i></div>
  <div class="today" id="today"></div>
</div>

<div class="btns">
  <button id="btnToday">跳到今天</button>
  <button id="btnAll">全部展开</button>
  <button id="btnReset">重置勾选</button>
</div>

<div id="weeks"></div>

<div class="foot">
  数据：<code>plan.js</code>（任务）／<code>PROGRESS.md</code>（进度）。勾选存本机浏览器，换浏览器不同步。<br>
  <b>贴左侧</b>：双击 <code>打开看板.bat</code> → <code>Win + ←</code>；<code>Ctrl + R</code> 刷新。
</div>

<script src="plan.js"></script>
<script>
const KEY="qa-progress-v2";
let state=JSON.parse(localStorage.getItem(KEY)||"{}");
let openSet=new Set(), firstRender=true;
const DAYNAME=["周日","周一","周二","周三","周四","周五","周六"];

function dstr(d){return (d.getMonth()+1)+"/"+d.getDate();}
function weekStart(w){return new Date(w.s+"T00:00:00");}
function dayDate(w,di){const d=new Date(weekStart(w).getTime());d.setDate(d.getDate()+di);return d;}
function today0(){const t=new Date();t.setHours(0,0,0,0);return t;}

function currentIdx(){
  const t=today0();
  return PLAN_DATA.findIndex(w=>{
    const s=weekStart(w), e=new Date(w.e+"T00:00:00");
    return t>=s && t<=e;
  });
}
function currentDay(w){
  const t=today0();
  for(let i=0;i<w.days.length;i++){ if(+dayDate(w,i)===+t) return i; }
  return -1;
}
function tid(w,di,ii){return `${w.id}-${di}-${ii}`;}
function isRest(it){return it[0]===0;}

function totals(){
  let total=0, done=0;
  PLAN_DATA.forEach(w=>w.days.forEach((d,di)=>d.items.forEach((it,ii)=>{
    if(isRest(it)) return;
    total++; if(state[tid(w,di,ii)]) done++;
  })));
  return {total,done};
}

function render(){
  const {total,done}=totals();
  document.getElementById("total").textContent=total;
  document.getElementById("done").textContent=done;
  const pc=total?Math.round(done/total*100):0;
  document.getElementById("prog").style.width=pc+"%";
  document.getElementById("pct").textContent=pc+"%";

  const ti=currentIdx();
  const now=PLAN_DATA[ti];
  if(firstRender){ if(ti>=0) openSet.add(ti); else openSet.add(0); firstRender=false; }

  if(now){
    const di=currentDay(now);
    document.getElementById("title").textContent=`${now.id} · ${now.theme}`;
    document.getElementById("sub").textContent=`${now.s} ~ ${now.e}`;
    const todo=di>=0?now.days[di].items.filter(it=>!isRest(it)):[];
    document.getElementById("today").innerHTML =
      `${di>=0?now.days[di].d+" "+now.days[di].dt:"本周"}　` +
      (todo.length?`<b>${todo.length}</b> 项待做：${todo.map(it=>it[1]).join("；").slice(0,80)}`:`<b>休息</b>，不打开学习文件`) +
      (now.gate?`　<span class="badge b-gate">${now.gate}</span>`:"");
  }else{
    const first=weekStart(PLAN_DATA[0]);
    const diff=Math.round((first-today0())/86400000);
    document.getElementById("title").textContent="QA 学习看板";
    document.getElementById("sub").textContent="计划周期 2026-11-20 ~ 2027-02-21";
    document.getElementById("today").innerHTML = diff>0
      ? `距开始还有 <b>${diff}</b> 天　明天先看 W0 周五：修用例三处`
      : `计划已结束。`;
  }

  const box=document.getElementById("weeks"); box.innerHTML="";
  PLAN_DATA.forEach((w,wi)=>{
    const el=document.createElement("div");
    el.className="week"+(wi===ti?" now":"")+(openSet.has(wi)?" open":"");
    let wt=0, wd=0;
    w.days.forEach((d,di)=>d.items.forEach((it,ii)=>{ if(isRest(it))return; wt++; if(state[tid(w,di,ii)]) wd++; }));

    const body=w.days.map((d,di)=>{
      const isToday = wi===ti && di===currentDay(w);
      const items=d.items.map((it,ii)=>{
        const rest=isRest(it);
        const ck=rest?"":`<input type="checkbox" data-k="${tid(w,di,ii)}" ${state[tid(w,di,ii)]?"checked":""}>`;
        return `<label class="item${state[tid(w,di,ii)]?" done":""}">
          ${ck}
          <span class="mm">${rest?"—":it[0]+"′"}</span>
          <span class="tx">${it[1]}${it[2]?`<span class="out">→ ${it[2]}</span>`:""}</span>
        </label>`;
      }).join("");
      return `<div class="dayblk${isToday?" today":""}">
        <div class="dh"><span class="dname">${d.d} ${d.dt}</span><span>${isToday?"今天":""}</span></div>
        ${items}
      </div>`;
    }).join("");

    el.innerHTML=`<div class="wh">
        <div><div class="wt">${w.id}　${w.theme} ${w.gate?`<span class="badge b-gate">${w.gate}</span>`:""}</div>
        <div class="wd">${w.s} ~ ${w.e}</div></div>
        <div class="wd">${wd}/${wt}</div>
      </div><div class="wb">${body}</div>`;

    el.querySelector(".wh").addEventListener("click",()=>{
      if(openSet.has(wi)) openSet.delete(wi); else openSet.add(wi);
      el.classList.toggle("open");
    });
    el.querySelectorAll("input[type=checkbox]").forEach(cb=>{
      cb.addEventListener("change",e=>{
        state[e.target.dataset.k]=e.target.checked;
        localStorage.setItem(KEY,JSON.stringify(state));
        const y=window.scrollY; render(); window.scrollTo(0,y);
      });
    });
    box.appendChild(el);
  });
}

document.getElementById("btnToday").addEventListener("click",()=>{
  const t=document.querySelector(".dayblk.today");
  if(t){ openSet.add(currentIdx()); render(); document.querySelector(".dayblk.today").scrollIntoView({behavior:"smooth",block:"center"}); }
  else document.getElementById("weeks").scrollIntoView({behavior:"smooth"});
});
document.getElementById("btnAll").addEventListener("click",()=>{
  const all=[...document.querySelectorAll(".week")];
  const anyClosed=all.some(e=>!e.classList.contains("open"));
  if(anyClosed){ PLAN_DATA.forEach((_,i)=>openSet.add(i)); } else { openSet.clear(); }
  render();
});
document.getElementById("btnReset").addEventListener("click",()=>{
  if(confirm("清空所有勾选？")){ state={}; localStorage.setItem(KEY,"{}"); render(); }
});

render();
</script>
</body>
</html>
